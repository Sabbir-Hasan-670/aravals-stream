name: Build & Release — Windows, Linux, macOS
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New release version (example: 1.0.0)'
        required: true
        default: '1.0.0'
        type: string
      channel:
        description: 'Stable Windows/Relay release or portable development release'
        required: true
        default: 'stable'
        type: choice
        options: [stable, development]
      source_ref:
        description: 'Source branch, tag or commit to build'
        required: true
        default: 'main'
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Validate version and freeze source commit
        id: source
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          ./scripts/set-release-version.ps1 -Version $env:RELEASE_VERSION
          if ($env:RELEASE_CHANNEL -eq 'stable' -and $env:RELEASE_VERSION.Contains('-')) { throw 'Stable releases require a version without a suffix.' }
          git fetch origin $env:DEFAULT_BRANCH
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the default branch.' }
          git diff --quiet FETCH_HEAD HEAD -- .github/workflows
          if ($LASTEXITCODE -ne 0) { throw 'Merge the reviewed workflow changes into the default branch before releasing this source.' }
          $headers = @{Authorization=('Bearer ' + $env:GH_TOKEN); Accept='application/vnd.github+json'}
          $existing = $null
          try { $existing = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:RELEASE_REPO/releases/tags/v$env:RELEASE_VERSION" }
          catch { if ([int]$_.Exception.Response.StatusCode -ne 404) { throw } }
          if ($existing -and -not $existing.draft) { throw 'This version is already published. Enter a new version.' }
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          "version=$env:RELEASE_VERSION" >> $env:GITHUB_OUTPUT
  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Set common release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./scripts/set-release-version.ps1 -Version $env:RELEASE_VERSION
      - name: Prepare FFmpeg and installer tools
        shell: pwsh
        run: |
          ./scripts/get-windows-ffmpeg.ps1
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Build and test Windows workstation
        shell: pwsh
        run: |
          dotnet build AravalsStream.sln -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          dotnet test AravalsStream.sln -c Release --no-build --logger trx --results-directory artifacts/tests
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
      - name: Package Windows installers
        shell: pwsh
        run: |
          ./installer/build-installer.ps1
          ./installer/build-agent-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: installer/output/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows-release
          path: artifacts/tests/*.trx
  portable:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Set common release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./scripts/set-release-version.ps1 -Version $env:RELEASE_VERSION
      - name: Install Linux FFmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install macOS FFmpeg
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - name: Test portable media and native contracts
        run: dotnet test tests/AravalsStream.PlatformTests/AravalsStream.PlatformTests.csproj -c Release -warnaserror --logger trx
      - name: Publish desktop
        run: dotnet publish src/AravalsStream.Desktop/AravalsStream.Desktop.csproj -c Release -warnaserror -r ${{ matrix.rid }} --self-contained true -o artifacts/desktop
      - name: Package desktop
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_RUNTIME: ${{ matrix.rid }}
        run: ./scripts/package-portable.ps1 -PublishDirectory artifacts/desktop -Runtime $env:RELEASE_RUNTIME -OutputDirectory artifacts/packages -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/packages/*.tar.gz
          if-no-files-found: error
  relay:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Relay package without deployment
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ./scripts/set-release-version.ps1 -Version $env:RELEASE_VERSION
          dotnet publish src/AravalsStream.Relay/AravalsStream.Relay.csproj -c Release -r linux-x64 --self-contained true -warnaserror -o artifacts/relay
          if ($LASTEXITCODE -ne 0) { throw 'Relay publish failed.' }
          chmod +x artifacts/relay/AravalsStream.Relay
          New-Item -ItemType Directory artifacts/packages -Force | Out-Null
          tar -czf "artifacts/packages/AravalsStream-Relay-$env:RELEASE_VERSION-linux-x64.tar.gz" -C artifacts/relay .
          if ($LASTEXITCODE -ne 0) { throw 'Relay package failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: release-relay
          path: artifacts/packages/*.tar.gz
          if-no-files-found: error
  release:
    needs: [prepare, windows, portable, relay]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts/release
          merge-multiple: true
      - name: Publish all platforms and automatic release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: ./scripts/publish-release.ps1 -Version $env:RELEASE_VERSION -Commit $env:BUILD_COMMIT -Repository $env:RELEASE_REPO -PackageDirectory artifacts/release -Channel $env:RELEASE_CHANNEL
